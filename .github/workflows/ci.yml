name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Three gates, one per thing that actually ships: the SolidJS frontend, the Cloudflare Worker,
# and lint. The legacy Express/SQLite backend under backend/ is NOT tested here — it is not part
# of either shipping runtime (browser-only mode is IndexedDB, cloud mode is the Worker), and its
# Jest suite asserted wall-clock timings on shared runners, which turned main red for no reason.
# It does still BOOT in e2e.yml, where it is the API the Playwright suite drives the real
# frontend against; see the note there before removing it.

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run frontend tests
        run: pnpm run test

  worker:
    name: Worker Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # Same install as deploy-worker.yml: worker/.gitignore deliberately does not pin a
      # lockfile ("deps installed fresh"), so --frozen-lockfile fails with ERR_PNPM_NO_LOCKFILE.
      - name: Install worker deps (outside the pnpm workspace)
        working-directory: worker
        run: pnpm install --no-frozen-lockfile --ignore-workspace

      - name: Typecheck
        working-directory: worker
        run: pnpm run typecheck

      # Runs the real Worker in workerd via Miniflare, against a local D1 built from
      # worker/migrations/ — so a broken migration fails here rather than at deploy time.
      - name: Run worker tests
        working-directory: worker
        run: pnpm run test

  lint:
    name: Lint Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint
