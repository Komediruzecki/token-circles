name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    # The suite runs serially on CI (see playwright.config.ts); a clean run is well under this,
    # so hitting it means something is hung rather than slow.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # worker/ is deliberately NOT a pnpm workspace member (see deploy-worker.yml), so the root
      # install does not reach it — and the suite now needs its wrangler.
      - name: Install worker dependencies
        working-directory: worker
        run: pnpm install --no-frozen-lockfile --ignore-workspace

      # `wrangler dev` runs the Worker locally against a local D1 and R2 under worker/.wrangler —
      # no Cloudflare account, no network. It needs a signing key like any other deployment; this
      # one signs sessions for a database that is deleted with the runner.
      - name: Configure the local Worker
        run: echo "JWT_SECRET=e2e-local-signing-key-not-a-real-secret" > worker/.dev.vars

      - name: Build frontend
        working-directory: ./frontend
        run: pnpm run build

      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: pnpm exec playwright install --with-deps chromium

      # Playwright starts both servers itself (wrangler on :8787, vite on :3800 proxied at it),
      # applies the D1 migrations, then runs a setup project that registers an account, seeds the
      # fixture profile and saves the signed-in state every spec starts from. See
      # frontend/playwright.config.ts and frontend/tests/global.setup.ts — the whole thing runs
      # locally with `pnpm run test:e2e`, which the four curl commands this replaces never did.
      - name: Run E2E tests
        working-directory: ./frontend
        env:
          CI: true
          PLAYWRIGHT_HEADLESS: true
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm run test:e2e:smoke
          else
            pnpm run test:e2e
          fi
        continue-on-error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: test-results/
          retention-days: 30
