name: Deploy API Worker

# API worker (Hono + D1 + R2) in worker/ — NOT part of the pnpm workspace, so it installs
# on its own with --ignore-workspace against worker/pnpm-lock.yaml.
#   push main          -> dev   (api.dev.tokencircles.com)
#   tag  v*            -> prod  (api.tokencircles.com)
#   workflow_dispatch  -> choose dev | prod
#
# Applies D1 migrations before each deploy (wrangler records applied ones in d1_migrations,
# so re-runs only apply new files). One-time per env, NOT done here:
#   pnpm run d1:create:{dev,prod}   (paste the printed database_id into worker/wrangler.jsonc)
#   pnpm run r2:create:{dev,prod}
#   pnpm run secret:{dev,prod}      (JWT_SECRET + GOOGLE_CLIENT_SECRET + TURNSTILE_SECRET)
# TURNSTILE_SECRET must be the secret belonging to the SAME widget as the site key that
# environment's frontend build uses (frontend/.env.dev / .env.production). Changing one
# without the other passes the widget client-side and 403s every sign-in server-side.
# Requires repo secrets: CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]

permissions:
  contents: read

jobs:
  deploy-worker:
    name: Deploy API Worker
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENABLED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            ENV="prod"
          else
            ENV="dev"
          fi
          echo "env=$ENV" >> "$GITHUB_OUTPUT"
          if [ "$ENV" = "prod" ]; then
            echo "db=finance-manager" >> "$GITHUB_OUTPUT"
          else
            echo "db=finance-manager-dev" >> "$GITHUB_OUTPUT"
          fi
          echo "Deploying API worker to: $ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install worker deps (outside the pnpm workspace)
        working-directory: worker
        # --frozen-lockfile, which the header above always claimed this did. It could not: the
        # lockfile was gitignored, so this ran --no-frozen-lockfile and every deploy — including
        # every PROD deploy — built with whatever npm served that morning. A deploy that cannot be
        # reproduced cannot be rolled back to a known-good toolchain either. The lockfile is now
        # committed and pins integrity hashes, so a republished or tampered tarball is refused
        # rather than installed.
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Typecheck
        working-directory: worker
        run: pnpm run typecheck

      # Migrations can be destructive (e.g. 0002 recreates the profiles table). D1 Time Travel
      # keeps every database restorable to any minute of the last 30 days (7 on the Workers Free
      # plan), so record the bookmark for this moment before applying: a bad migration is undone
      # with `wrangler d1 time-travel restore <db> --env <env> --bookmark=<bookmark>`.
      # Never put a dump of the database in an artifact: this repository is public, and any
      # signed-in GitHub account can download its artifacts.
      - name: Record the D1 restore point before migrations (${{ steps.env.outputs.env }})
        id: restore_point
        if: env.DEPLOY_ENABLED == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 time-travel info ${{ steps.env.outputs.db }} --env ${{ steps.env.outputs.env }}
          packageManager: pnpm
          # wrangler-action@v3 installs an old default wrangler that can't run `d1 migrations
          # apply` against this config or deploy an assets-only Worker. Pin a current 4.x.
          wranglerVersion: '4.106.0'

      - name: Show the restore point in the job summary
        if: env.DEPLOY_ENABLED == 'true'
        env:
          RESTORE_POINT: ${{ steps.restore_point.outputs.command-output }}
          DEPLOY_TARGET: ${{ steps.env.outputs.env }}
        run: |
          {
            echo "### D1 restore point, $DEPLOY_TARGET, before migrations"
            echo
            echo '```'
            echo "$RESTORE_POINT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply D1 migrations (${{ steps.env.outputs.env }})
        if: env.DEPLOY_ENABLED == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 migrations apply ${{ steps.env.outputs.db }} --remote --env ${{ steps.env.outputs.env }}
          packageManager: pnpm
          # wrangler-action@v3 installs an old default wrangler that can't run `d1 migrations
          # apply` against this config or deploy an assets-only Worker. Pin a current 4.x.
          wranglerVersion: '4.106.0'

      - name: Deploy worker (${{ steps.env.outputs.env }})
        if: env.DEPLOY_ENABLED == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --env ${{ steps.env.outputs.env }}
          packageManager: pnpm
          # wrangler-action@v3 installs an old default wrangler that can't run `d1 migrations
          # apply` against this config or deploy an assets-only Worker. Pin a current 4.x.
          wranglerVersion: '4.106.0'
